name: frontend

on:
  push:
    branches: ['**']
    tags: ['front_v*.*.*']
    paths: ['frontend/**']
  pull_request:
    paths: ['frontend/**']

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/front_v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dist
        run: zip -r frontend-dist.zip dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/frontend-dist.zip
          generate_release_notes: true
