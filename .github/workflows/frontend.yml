name: frontend

on:
  push:
    branches: ['**']
    tags: ['front_v*.*.*']
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: lint + typecheck + unit + build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - name: Checkout UI kit
        uses: actions/checkout@v4
        with:
          repository: onix-fun/ui-kit
          path: ui-kit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui-kit/package-lock.json
            frontend/package-lock.json

      - name: Install UI kit
        working-directory: ui-kit
        run: npm ci

      - name: Build UI kit
        working-directory: ui-kit
        run: npm run build

      - name: Install frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Setup Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL }}

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  verify:
    name: E2E + accessibility + visual
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Checkout UI kit
        uses: actions/checkout@v4
        with:
          repository: onix-fun/ui-kit
          path: ui-kit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui-kit/package-lock.json
            frontend/package-lock.json

      - name: Install UI kit
        working-directory: ui-kit
        run: npm ci

      - name: Build UI kit
        working-directory: ui-kit
        run: npm run build

      - name: Install frontend
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend:
    name: contact API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/contact-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/contact-api/package-lock.json

      - name: Install
        run: npm ci --omit=dev

      - name: Test
        run: npm test

  deploy:
    name: deploy dev site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, verify, backend]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/front_v')
    needs: [check, verify, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout UI kit
        uses: actions/checkout@v4
        with:
          repository: onix-fun/ui-kit
          path: ui-kit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui-kit/package-lock.json
            frontend/package-lock.json

      - name: Install UI kit
        working-directory: ui-kit
        run: npm ci

      - name: Build UI kit
        working-directory: ui-kit
        run: npm run build

      - name: Install frontend
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL }}

      - name: Package dist
        run: zip -r frontend-dist.zip dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/frontend-dist.zip
          generate_release_notes: true
